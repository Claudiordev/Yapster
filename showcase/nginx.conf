# Static file server for the Voxsi showcase site (Next.js static export).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Next.js export uses trailingSlash: true, so /foo/ -> /foo/index.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Hashed build assets can be cached for good; HTML must always be revalidated.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
