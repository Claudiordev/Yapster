# LiveKit server config for local development.
# Signaling on 7880 (HTTP/WebSocket); WebRTC media over UDP 7882 with a TCP
# fallback on 7881. use_external_ip is false because clients reach the server
# over localhost in this setup.
port: 7880

rtc:
  tcp_port: 7881
  # A single UDP port, not a range. Docker maps each port in a range with its
  # own userland proxy process, so a 60-port range is slow to publish and
  # unreliable — ICE candidates for it often aren't actually reachable, the
  # handshake fails ("could not establish pc connection") and media limps along
  # on the 7881 TCP fallback instead. One port is LiveKit's own recommendation
  # for containerised deployments and is all an SFU needs (it multiplexes every
  # participant over it).
  udp_port: 7882
  use_external_ip: false
  # Floor for the server's estimate of a viewer's bandwidth (bits per second). The
  # allocator uses max(its own estimate, this floor) for the whole session, not just at
  # the start: it stops a new screen share waiting to probe before it is forwarded at
  # full quality, but it also means a viewer on a slower link is never throttled below
  # it. Keep it just above the biggest stream one viewer receives (screen share
  # target 7.5 Mbps -> 8 Mbps); much higher only makes the server less careful.
  congestion_control:
    enabled: true
    stream_allocator:
      min_channel_capacity: 8000000
  # node_ip is NOT set here — it comes from the NODE_IP env var in
  # docker-compose.yaml, because the right value depends on how you reach the
  # app and can't be committed.
  #
  # It's the address LiveKit puts in its ICE candidates, so it has to be an
  # address the BROWSER can dial. Left to auto-detect, a container picks its
  # own Docker bridge IP (172.x), which no browser can reach — signaling still
  # connects over the published 7880, but the media/DTLS handshake then dies.
  # 127.0.0.1 only works when the browser is on the Docker host itself; open
  # the app from a LAN IP or another device and you need the host's LAN IP.

# API key -> secret. The secret is the HS256 signing key the voice service uses
# to mint join tokens; it must match LIVEKIT_API_SECRET passed to that service.
# Dev-only value — rotate and inject via env/secret store for any real deployment.
keys:
  devkey: devsecretdevsecretdevsecret12345

# Room events (participant joined/left, room finished) go to the voice service, which
# reads the room's full participant list and reports it to chat (who is in a call).
# LiveKit signs each request with this API key's secret; voice verifies it. voice is
# the compose service name, so this only works inside the compose network.
webhook:
  api_key: devkey
  urls:
    - http://voice:8085/api/v1/voice/livekit

logging:
  level: info
