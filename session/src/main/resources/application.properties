server.port=${SERVER_PORT:8081}
spring.application.name=session
url.api.base-path=${API_BASE_PATH:/api/v1}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
management.endpoints.web.exposure.include=health,info,beans,prometheus
# Tag every metric with the service name so Prometheus/Grafana can filter by app
management.metrics.tags.application=session

# Distributed tracing: sample everything in dev, push spans to Jaeger via OTLP
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# Eureka client config
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}

# Redis (shared cache and rate limiting).
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Login rate limiting (shared across service instances through Redis).
rate-limiting.login.max-attempts=${RATE_LIMITING_LOGIN_MAX_ATTEMPTS:10}
rate-limiting.login.window=${RATE_LIMITING_LOGIN_WINDOW:15m}
rate-limiting.register.max-attempts=${RATE_LIMITING_REGISTER_MAX_ATTEMPTS:5}
rate-limiting.register.window=${RATE_LIMITING_REGISTER_WINDOW:1h}
rate-limiting.file-upload.max-attempts=${RATE_LIMITING_FILE_UPLOAD_MAX_ATTEMPTS:10}
rate-limiting.file-upload.window=${RATE_LIMITING_FILE_UPLOAD_WINDOW:1h}

# MinIO (avatar object storage). endpoint = where the SDK connects (docker service name);
# public-url = browser-reachable base for the stored avatar URL. Use localhost for both when local.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:avatars}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# Avatar uploads are small — cap multipart size.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Collections (roles, server members) load in IN-batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=16
logging.level.org.springframework.security=DEBUG

spring.flyway.enabled=true

security.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
security.jwt.additional-public-paths[0]=/api/v1/auth/**
security.jwt.additional-public-paths[1]=/actuator/prometheus
security.jwt.authenticated-paths[0]=/api/v1/user/**
security.jwt.authenticated-paths[1]=/api/v1/users/**
security.jwt.authenticated-paths[2]=/api/v1/servers/**
jwt.private-key.path=${JWT_PRIVATE_KEY_PATH:keys/private.pem}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
