services:
  session_postgres:
    image: postgres:16
    container_name: session_postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - "session_postgres:/var/lib/postgresql/data"
  comms_postgres:
    image: postgres:16
    container_name: comms_postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: comms
    ports:
      - "5433:5432"
    volumes:
      - "comms_postgres:/var/lib/postgresql/data"
  chat_postgres:
    image: postgres:16
    container_name: chat_postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: chat
    ports:
      - "5435:5432"
    volumes:
      - "chat_postgres:/var/lib/postgresql/data"
  discovery:
    build:
      context: .
      dockerfile: discovery/Dockerfile
    container_name: discovery
    ports:
      - "8761:8761"
  session:
    build:
      context: .
      dockerfile: session/Dockerfile
    container_name: session
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://discovery:8761/eureka/}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://session_postgres:5432/mydatabase}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://jaeger:4318/v1/traces}
      - RATE_LIMITING_LOGIN_MAX_ATTEMPTS=${RATE_LIMITING_LOGIN_MAX_ATTEMPTS:-10}
      - RATE_LIMITING_LOGIN_WINDOW=${RATE_LIMITING_LOGIN_WINDOW:-15m}
      - RATE_LIMITING_REGISTER_MAX_ATTEMPTS=${RATE_LIMITING_REGISTER_MAX_ATTEMPTS:-5}
      - RATE_LIMITING_REGISTER_WINDOW=${RATE_LIMITING_REGISTER_WINDOW:-1h}
      - RATE_LIMITING_FILE_UPLOAD_MAX_ATTEMPTS=${RATE_LIMITING_FILE_UPLOAD_MAX_ATTEMPTS:-10}
      - RATE_LIMITING_FILE_UPLOAD_WINDOW=${RATE_LIMITING_FILE_UPLOAD_WINDOW:-1h}
    depends_on:
      - session_postgres
      - minio
      - redis
  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    container_name: router
    ports:
      - "8080:8080"
    depends_on:
      - discovery
      - session
  comms:
    build:
      context: .
      dockerfile: comms/Dockerfile
    container_name: comms
    ports:
      - "8082:8082"
    environment:
      # COMMS_PROVIDER=stub docker compose up -d  → no real SMS (load testing)
      - COMMS_PROVIDER=${COMMS_PROVIDER:-twilio}
    depends_on:
      - comms_postgres
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    command: --config /etc/livekit.yaml
    environment:
      # The address LiveKit advertises in its ICE candidates — must be one the
      # BROWSER can dial. Default suits a browser on this same host; when you
      # open the app from a LAN IP (or a second device), set PUBLIC_HOST to
      # this host's LAN IP or the media handshake will fail even though
      # signaling connects. See livekit/livekit.yaml.
      - NODE_IP=${PUBLIC_HOST:-127.0.0.1}
    ports:
      - "7880:7880"       # signaling (HTTP/WebSocket)
      - "7881:7881"       # WebRTC over TCP (fallback)
      - "7882:7882/udp"   # WebRTC media (RTP/ICE)
    volumes:
      - "./livekit/livekit.yaml:/etc/livekit.yaml"
  voice:
    build:
      context: .
      dockerfile: voice/Dockerfile
    container_name: voice
    ports:
      - "8085:8085"
    environment:
      # Handed to the browser as the address to dial, so it must be reachable
      # from wherever the app is opened — NOT a container-internal name, and
      # not localhost once anything but this host is browsing. Same
      # PUBLIC_HOST as LiveKit's NODE_IP so the two can't drift apart.
      # key/secret must match livekit/livekit.yaml
      - LIVEKIT_URL=ws://${PUBLIC_HOST:-localhost}:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecretdevsecretdevsecret12345
      - INTERNAL_SECRET=${INTERNAL_SECRET:-}
    depends_on:
      - livekit
  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    container_name: chat
    ports:
      - "8086:8086"
    environment:
      # Override the localhost defaults baked into application.properties so chat
      # joins the compose network: registers in Eureka via the discovery service
      # and reaches Postgres by service name (fixes lb://CHAT -> 10.255.255.254).
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://chat_postgres:5432/chat
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - RATE_LIMITING_MESSAGE_MAX_ATTEMPTS=${RATE_LIMITING_MESSAGE_MAX_ATTEMPTS:-20}
      - RATE_LIMITING_MESSAGE_WINDOW=${RATE_LIMITING_MESSAGE_WINDOW:-10s}
      - INTERNAL_SECRET=${INTERNAL_SECRET:-}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - chat_postgres
      - redis
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "prometheus_data:/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - session
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - "minio_data:/data"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  session_postgres:
  service_pgdata:
  comms_postgres:
  chat_postgres:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  prometheus_data:
  minio_data:
