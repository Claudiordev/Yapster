server.port=8080

spring.application.name=router

spring.main.web-application-type=reactive

# Eureka client config
eureka.client.service-url.defaultZone=http://discovery:8761/eureka/
eureka.instance.prefer-ip-address=true

# Distributed tracing: sample everything in dev, push spans to Jaeger via OTLP
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://jaeger:4318/v1/traces

# Redis backs the gateway's distributed token bucket. All router replicas use
# the same counters, so adding replicas does not multiply a user's allowance.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Used only to derive an unforgeable per-user rate-limit key. Downstream
# services remain responsible for authorization.
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}

# Routes using Eureka service discovery (lb:// = load-balanced)
spring.cloud.gateway.server.webflux.routes[0].id=session-auth-path
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SESSION
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/api/v1/auth

spring.cloud.gateway.server.webflux.routes[1].id=session-auth-sub
spring.cloud.gateway.server.webflux.routes[1].uri=lb://SESSION
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/auth/?(.*),/api/v1/auth/$1

spring.cloud.gateway.server.webflux.routes[2].id=comms-messages-path
spring.cloud.gateway.server.webflux.routes[2].uri=lb://COMMS
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/messages
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/api/v1/messages

spring.cloud.gateway.server.webflux.routes[3].id=comms-messages-sub
spring.cloud.gateway.server.webflux.routes[3].uri=lb://COMMS
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/messages/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/messages/?(.*),/api/v1/messages/$1

spring.cloud.gateway.server.webflux.routes[4].id=trading-path
spring.cloud.gateway.server.webflux.routes[4].uri=lb://TRADING
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/trading
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/api/v1/trading

spring.cloud.gateway.server.webflux.routes[5].id=trading-sub
spring.cloud.gateway.server.webflux.routes[5].uri=lb://TRADING
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/trading/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/trading/?(.*),/api/v1/trading/$1

spring.cloud.gateway.server.webflux.routes[6].id=metrics-path
spring.cloud.gateway.server.webflux.routes[6].uri=lb://METRICS
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/metrics
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/api/v1/metrics

spring.cloud.gateway.server.webflux.routes[7].id=metrics-sub
spring.cloud.gateway.server.webflux.routes[7].uri=lb://METRICS
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/metrics/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/metrics/?(.*),/api/v1/metrics/$1

spring.cloud.gateway.server.webflux.routes[8].id=session-user-path
spring.cloud.gateway.server.webflux.routes[8].uri=lb://SESSION
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/user
spring.cloud.gateway.server.webflux.routes[8].filters[0]=SetPath=/api/v1/user

spring.cloud.gateway.server.webflux.routes[9].id=session-user-sub
spring.cloud.gateway.server.webflux.routes[9].uri=lb://SESSION
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/user/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RewritePath=/user/?(.*),/api/v1/user/$1

spring.cloud.gateway.server.webflux.routes[10].id=session-users-path
spring.cloud.gateway.server.webflux.routes[10].uri=lb://SESSION
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/users
spring.cloud.gateway.server.webflux.routes[10].filters[0]=SetPath=/api/v1/users

spring.cloud.gateway.server.webflux.routes[11].id=session-users-sub
spring.cloud.gateway.server.webflux.routes[11].uri=lb://SESSION
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webflux.routes[11].filters[0]=RewritePath=/users/?(.*),/api/v1/users/$1

spring.cloud.gateway.server.webflux.routes[12].id=chat-http
spring.cloud.gateway.server.webflux.routes[12].uri=lb://CHAT
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/chat,/chat/**
spring.cloud.gateway.server.webflux.routes[12].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[12].filters[0].args[key-resolver]=#{@chatUserKeyResolver}
spring.cloud.gateway.server.webflux.routes[12].filters[0].args[redis-rate-limiter.replenishRate]=${CHAT_RATE_LIMIT_REPLENISH_RATE:5}
spring.cloud.gateway.server.webflux.routes[12].filters[0].args[redis-rate-limiter.burstCapacity]=${CHAT_RATE_LIMIT_BURST_CAPACITY:15}
spring.cloud.gateway.server.webflux.routes[12].filters[0].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.routes[12].filters[1]=RewritePath=/chat(?<segment>/?.*),/api/v1/chat$\{segment}

spring.cloud.gateway.server.webflux.routes[13].id=chat-ws
spring.cloud.gateway.server.webflux.routes[13].uri=lb://CHAT
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/ws

spring.cloud.gateway.server.webflux.routes[14].id=voice-path
spring.cloud.gateway.server.webflux.routes[14].uri=lb://VOICE
spring.cloud.gateway.server.webflux.routes[14].predicates[0]=Path=/voice
spring.cloud.gateway.server.webflux.routes[14].filters[0]=SetPath=/api/v1/voice

spring.cloud.gateway.server.webflux.routes[15].id=voice-sub
spring.cloud.gateway.server.webflux.routes[15].uri=lb://VOICE
spring.cloud.gateway.server.webflux.routes[15].predicates[0]=Path=/voice/**
spring.cloud.gateway.server.webflux.routes[15].filters[0]=RewritePath=/voice/?(.*),/api/v1/voice/$1

# Message writes need a tighter bucket than chat reads. This route has a lower
# order than chat-http, so POST /chat/{conversationId}/message is matched here
# first. A full bucket plus ten seconds of refill can admit at most 20 sends,
# which stays within the chat service's default 20-per-10-second safety limit.
spring.cloud.gateway.server.webflux.routes[16].id=chat-message
spring.cloud.gateway.server.webflux.routes[16].order=-1
spring.cloud.gateway.server.webflux.routes[16].uri=lb://CHAT
spring.cloud.gateway.server.webflux.routes[16].predicates[0]=Path=/chat/*/message
spring.cloud.gateway.server.webflux.routes[16].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[16].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[16].filters[0].args[key-resolver]=#{@chatUserKeyResolver}
spring.cloud.gateway.server.webflux.routes[16].filters[0].args[redis-rate-limiter.replenishRate]=${CHAT_MESSAGE_RATE_LIMIT_REPLENISH_RATE:1}
spring.cloud.gateway.server.webflux.routes[16].filters[0].args[redis-rate-limiter.burstCapacity]=${CHAT_MESSAGE_RATE_LIMIT_BURST_CAPACITY:10}
spring.cloud.gateway.server.webflux.routes[16].filters[0].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.routes[16].filters[1]=RewritePath=/chat(?<segment>/?.*),/api/v1/chat$\{segment}

# Never expose voice-to-chat status updates through the public gateway.
# The voice service calls chat directly over the internal service network.
spring.cloud.gateway.server.webflux.routes[17].id=internal-chat-service
spring.cloud.gateway.server.webflux.routes[17].order=-100
spring.cloud.gateway.server.webflux.routes[17].uri=no://op
spring.cloud.gateway.server.webflux.routes[17].predicates[0]=Path=/chat/internal/voice/**
spring.cloud.gateway.server.webflux.routes[17].filters[0]=SetStatus=404

management.endpoint.gateway.access=unrestricted
management.endpoints.web.exposure.include=gateway,health
