server:
  port: 8086

spring:
  application:
    name: chat
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driverClassName: org.postgresql.Driver
    username: myuser
    password: mypassword
    url: jdbc:postgresql://localhost:5435/chat
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 16
  flyway:
    enabled: true

url:
  api:
    base-path: /api/v1

logging:
  pattern:
    # `level` (not `console`) so the normal format, including the message, is kept
    # and only the level column gets the [app,traceId,spanId] tag.
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.socket: DEBUG
    com.claudiordese.chat: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: host.docker.internal

security:
  jwt:
    authenticated-paths:
      - /api/v1/chat/**
    additional-public-paths:
      - /ws
      - /api/v1/internal/chat/**

internal:
  secret: ${INTERNAL_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,beans
  metrics:
    tags:
      application: chat
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
